{% extends "layout.html" %}{% block title %}报表{% endblock %}
{% block body %}
{% for cadence, label in [('daily','日报'),('weekly','周报'),('monthly','月报')] %}
<div class="card"><h2>{{ label }}</h2>
{% for e in listing[cadence] %}<a href="{{ url_for('report_file', cadence=cadence, key=e.key, name=e.file) }}" target="_blank" style="display:inline-block;margin:2px 10px 2px 0">{{ e.key }}</a>{% else %}<span class="muted">暂无</span>{% endfor %}
</div>{% endfor %}
{% endblock %}
