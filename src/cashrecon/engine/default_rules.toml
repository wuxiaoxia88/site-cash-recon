# 默认分类规则（首次初始化写入数据库，之后可在控制台修改）。
# source: 流水来源（ZT_SUMMARY 指中天科目分项，路径格式“一级/二级/三级/描述”）或 *
# field:  path | src_category | counterparty | summary
# op:     contains | equals | prefix | regex
# direction: IN | OUT | *（对中天科目分项，IN=金额为正）
# priority: 数字越小越优先
version = 4

# ------------------------------------------------------------ 中天科目分项
[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "contains"
pattern = "中通支付充值"
category = "XFER_ZT_TOPUP"
priority = 10

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "中天余额提现|线下提现"
category = "XFER_ZT_WITHDRAW"
priority = 10

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "contains"
pattern = "中通支付提现"
category = "PASS_THROUGH"
priority = 10
note = "中通支付钱包往来"

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "/(收|付)(线上)?代收货款$|/(收|付)到付款$"
category = "PASS_THROUGH"
priority = 10

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "/(收|付)转账$"
category = "COST_CLAIM"
priority = 10
note = "协商理赔/扣款"

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "contains"
pattern = "大客户补贴"
category = "INC_POLICY"
priority = 10

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "contains"
pattern = "平台服务"
category = "COST_ADMIN"
priority = 10

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "质押款"
category = "PASS_THROUGH"
priority = 10

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "/(调节派费|考核派费|派件派费补贴)$"
category = "COST_POLICY"
priority = 20

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "contains"
pattern = "物料系统结算款"
category = "COST_WAYBILL"
priority = 20

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "contains"
pattern = "车辆保险"
category = "COST_VEHICLE"
priority = 20

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务收入/进港派件收入"
category = "INC_DELIVERY"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务收入/出港其他收入"
category = "INC_PICKUP"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "^主营业务收入/(出港|进港)政策收入"
category = "INC_POLICY"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务收入/进港其他收入"
category = "INC_VAS"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务收入"
category = "INC_OTHER"
priority = 90

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务成本/出港业务成本/付寄件签收派费"
category = "COST_SEND_DISPATCH"
priority = 40

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务成本/出港业务成本"
category = "COST_LINEHAUL"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "^主营业务成本/(出港|进港)政策成本"
category = "COST_POLICY"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务成本/出港其他成本"
category = "COST_VAS"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务成本/进港业务成本/付下级派件派费"
category = "COST_SUBSITE"
priority = 40

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务成本/进港业务成本"
category = "COST_WAYBILL"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "主营业务成本"
category = "COST_OTHER"
priority = 90

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "营业成本/自有车辆成本"
category = "COST_VEHICLE"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "营业成本"
category = "COST_OTHER"
priority = 90

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "管理费用"
category = "COST_ADMIN"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "prefix"
pattern = "财务费用"
category = "COST_FINANCE"
priority = 50

[[rules]]
source = "ZT_SUMMARY"
field = "path"
op = "regex"
pattern = "^其他业务(收入|支出)"
category = "COST_CLAIM"
priority = 50
note = "其他奖罚/理赔按净额计入罚款与理赔"

# ------------------------------------------------------------ 中天逐笔（仅用于资金去向）
[[rules]]
source = "ZT_FLOW"
field = "src_category"
op = "regex"
pattern = "线下提现|中天余额提现"
category = "XFER_ZT_WITHDRAW"
priority = 10

[[rules]]
source = "ZT_FLOW"
field = "src_category"
op = "equals"
pattern = "中通支付充值"
category = "XFER_ZT_TOPUP"
priority = 10

[[rules]]
source = "ZT_FLOW"
field = "src_category"
op = "equals"
pattern = "转账"
category = "COST_CLAIM"
priority = 10

# ------------------------------------------------------------ 线下：划转与非经营
[[rules]]
source = "*"
field = "src_category"
op = "contains"
pattern = "中天余额充值"
category = "XFER_ZT_TOPUP"
priority = 10

[[rules]]
source = "*"
field = "counterparty"
op = "equals"
pattern = "中通快递股份有限公司"
direction = "OUT"
category = "XFER_ZT_TOPUP"
priority = 15

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "余额修改"
category = "ADJUST"
priority = 10

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "账户间互转|提现至银行卡|跨行汇款"
category = "XFER_INTERNAL"
priority = 20

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "押金|小额对冲"
category = "PASS_THROUGH"
priority = 20

[[rules]]
source = "*"
field = "src_category"
op = "contains"
pattern = "贷款本息"
category = "FINANCING"
priority = 20

# ------------------------------------------------------------ 线下：收入
[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "驿站.*(收入|提现)|收驿站"
direction = "IN"
category = "INC_STATION"
priority = 30

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "客户运费|快递费收入|大客户快递费|直链|经营收入|客户直接转账|收钱码收款|充单分账"
direction = "IN"
category = "INC_PICKUP"
priority = 40

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "退单款|退客户运费"
direction = "OUT"
category = "INC_PICKUP"
priority = 40
note = "退款冲减揽收收入"

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "利息收入|其他收入|退款"
direction = "IN"
category = "INC_OTHER"
priority = 60

# ------------------------------------------------------------ 线下：成本
[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "工资|社保|公积金|雇主险"
category = "COST_LABOR"
priority = 30

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "加油|车辆|运输成本|维修"
category = "COST_VEHICLE"
priority = 35

[[rules]]
source = "*"
field = "counterparty"
op = "regex"
pattern = "石化|石油|加油"
direction = "OUT"
category = "COST_VEHICLE"
priority = 35

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "驿站|快递柜|房租|水电|租金|场地"
category = "COST_STATION"
priority = 40

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "物料|面单|单号成本"
category = "COST_WAYBILL"
priority = 40

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "理赔|罚款"
category = "COST_CLAIM"
priority = 40

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "手续费|财务费用|展期服务费"
category = "COST_FINANCE"
priority = 40

[[rules]]
source = "*"
field = "src_category"
op = "regex"
pattern = "税|办公|杂费|管理费用|缴费"
category = "COST_ADMIN"
priority = 45

[[rules]]
source = "*"
field = "counterparty"
op = "contains"
pattern = "保险"
direction = "OUT"
category = "COST_ADMIN"
priority = 50

[[rules]]
source = "*"
field = "src_category"
op = "contains"
pattern = "其他支出"
direction = "OUT"
category = "COST_OTHER"
priority = 60
